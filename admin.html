<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vijay Electronics — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<style>
/* Vijay Electronics — storefront styles */
:root{
  --navy:#0e1e3b;
  --navy-2:#152a52;
  --navy-3:#1e3a6e;
  --amber:#e8871e;
  --amber-dark:#c96f12;
  --emerald:#1c7a5e;
  --emerald-dark:#145c46;
  --cream:#f7f4ee;
  --card:#ffffff;
  --ink:#151a2b;
  --muted:#5c6478;
  --line:#e7e2d8;
  --radius-lg:20px;
  --radius-sm:8px;
  --shadow:0 10px 30px -12px rgba(14,30,59,.25);
  --maxw:1240px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
  background:var(--cream);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Sora','Inter',sans-serif;
  margin:0;
  color:var(--navy);
  font-weight:700;
  letter-spacing:-.01em;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
img{max-width:100%;display:block;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
 
/* ---------- Topbar ---------- */
.topbar{background:var(--navy);color:#c9d3e8;font-size:13px;}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;height:36px;gap:16px;flex-wrap:wrap;}
.topbar a{color:#c9d3e8;}
.topbar .badge{color:#ffcf9a;display:flex;align-items:center;gap:6px;}
.topbar .left{display:flex;gap:22px;}
.topbar .left span{display:flex;align-items:center;gap:6px;}
 
/* ---------- Header ---------- */
header.site{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
.headerbar{display:flex;align-items:center;gap:28px;height:78px;}
.logo{display:flex;flex-direction:column;flex-shrink:0;}
.logo .mark{font-family:'Sora',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.01em;color:var(--navy);}
.logo .mark span{color:var(--amber);}
.logo .tag{font-size:10.5px;letter-spacing:.14em;color:var(--muted);margin-top:1px;}
.searchbox{flex:1;position:relative;max-width:560px;}
.searchbox input{
  width:100%;height:46px;border:1.5px solid var(--line);border-radius:999px;
  padding:0 20px 0 46px;font-size:14.5px;background:#faf9f6;color:var(--ink);
}
.searchbox input:focus{border-color:var(--amber);background:#fff;}
.searchbox .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);}
.search-suggest{
  position:absolute;top:52px;left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);max-height:420px;overflow:auto;z-index:50;display:none;
}
.search-suggest.open{display:block;}
.search-suggest .meta{padding:10px 18px 4px;font-size:11.5px;color:var(--muted);}
.sugg-item{display:flex;align-items:center;gap:12px;padding:10px 18px;cursor:pointer;}
.sugg-item:hover{background:#faf6ee;}
.sugg-thumb{width:38px;height:38px;border-radius:8px;background:var(--navy);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;}
.sugg-name{font-size:13.5px;font-weight:600;color:var(--ink);}
.sugg-sub{font-size:11.5px;color:var(--muted);}
.sugg-price{margin-left:auto;font-weight:700;font-size:13px;color:var(--navy);white-space:nowrap;}
.sugg-empty{padding:20px;text-align:center;color:var(--muted);font-size:13.5px;}
.navlinks{display:flex;align-items:center;gap:26px;flex-shrink:0;font-size:14.5px;font-weight:600;color:var(--navy);}
.navlinks a:hover{color:var(--amber-dark);}
.navlinks .fire{color:var(--amber-dark);}
.headicons{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.iconbtn{position:relative;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f3f0e9;color:var(--navy);}
.iconbtn:hover{background:#ece7db;}
.cartcount{position:absolute;top:-4px;right:-4px;background:var(--amber);color:#fff;font-size:10.5px;font-weight:800;border-radius:50%;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.mobile-only{display:none;}
.desk-only{display:flex;}
 
/* ---------- Hero ---------- */
.hero{background:linear-gradient(150deg,var(--navy) 0%,var(--navy-3) 100%);color:#fff;position:relative;overflow:hidden;}
.hero .wrap{display:grid;grid-template-columns:1.25fr .85fr;gap:56px;padding:64px 24px 88px;align-items:center;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(232,135,30,.18);border:1px solid rgba(232,135,30,.4);color:#ffcf9a;font-size:13px;font-weight:700;padding:7px 16px;border-radius:999px;margin-bottom:22px;}
.hero h1{font-size:48px;line-height:1.08;color:#fff;max-width:560px;}
.hero h1 em{font-style:normal;color:var(--amber);}
.hero p.lead{color:#c9d3e8;font-size:16.5px;max-width:480px;margin-top:18px;}
.hero .ctas{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:12px;font-weight:700;font-size:15px;transition:transform .15s ease;}
.btn:active{transform:scale(.97);}
.btn-amber{background:var(--amber);color:#fff;}
.btn-amber:hover{background:var(--amber-dark);}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.35);}
.btn-ghost:hover{background:rgba(255,255,255,.16);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:var(--navy-2);}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--navy);}
.btn-outline:hover{border-color:var(--amber);}
.btn-block{width:100%;justify-content:center;}
.btn-sm{padding:9px 16px;font-size:13.5px;border-radius:9px;}
.trustcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:var(--radius-lg);padding:26px;backdrop-filter:blur(6px);}
.trust-row{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.12);}
.trust-row:last-child{border-bottom:none;}
.trust-ic{width:38px;height:38px;border-radius:10px;background:rgba(232,135,30,.22);color:var(--amber);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.trust-t{font-weight:700;font-size:14.5px;color:#fff;}
.trust-d{font-size:12.5px;color:#aebada;margin-top:2px;}
 
/* ---------- Hero carousel (flowing shop photos + offers) ---------- */
.hero-carousel{position:relative;overflow:hidden;background:var(--navy);color:#fff;}
.hero-track{display:flex;transition:transform .9s cubic-bezier(.65,0,.35,1);}
.hero-slide{min-width:100%;position:relative;display:flex;align-items:center;min-height:440px;padding:64px 24px;}
.hero-slide-bg{position:absolute;inset:0;z-index:0;background:linear-gradient(150deg,var(--navy) 0%,var(--navy-3) 100%);}
.hero-slide-bg .photo-slot,.hero-slide-bg img{width:100%;height:100%;object-fit:cover;}
.hero-slide-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,30,59,.92) 0%,rgba(14,30,59,.55) 55%,rgba(14,30,59,.25) 100%);}
.hero-slide-bg .photo-fallback{background:transparent;}
.hero-slide-body{position:relative;z-index:1;max-width:640px;margin:0 auto;width:100%;padding:0 24px;animation:heroFade .7s ease both;}
@keyframes heroFade{from{opacity:0;transform:translateY(16px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.hero-slide-body h1{font-size:42px;line-height:1.12;color:#fff;}
.hero-slide-body h1 em{font-style:normal;color:var(--amber);}
.hero-slide-body p.lead{color:#c9d3e8;font-size:16px;max-width:480px;margin-top:16px;}
.hero-dots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2;}
.hero-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:.2s;}
.hero-dot.active{background:var(--amber);width:22px;border-radius:5px;}
.trust-strip{background:#fff;border-bottom:1px solid var(--line);}
.trust-strip .wrap{display:flex;justify-content:center;gap:36px;padding:14px 24px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--muted);}
 
/* ---------- Sections ---------- */
section.pad{padding:64px 0;}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:30px;gap:20px;flex-wrap:wrap;}
.sec-head h2{font-size:28px;}
.sec-head p{color:var(--muted);font-size:14.5px;margin-top:4px;}
.sec-link{font-weight:700;color:var(--amber-dark);font-size:14px;white-space:nowrap;}
 
/* Stores */
.stores-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.stores-simple-list{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-lg);padding:6px 24px;}
.store-simple{padding:18px 0;border-bottom:1px solid var(--line);}
.store-simple:last-child{border-bottom:none;}
.store-simple h4{font-size:15.5px;margin-bottom:6px;color:var(--navy);}
.store-simple .hoTag{color:var(--amber-dark);font-weight:700;font-size:12px;}
.store-simple p{color:var(--muted);font-size:13.5px;margin:4px 0;}
.store-simple p a{color:var(--navy);font-weight:600;}
.store-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-lg);padding:26px;position:relative;}
.store-card.ho{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,135,30,.12);}
.store-badge{position:absolute;top:-12px;left:24px;background:var(--amber);color:#fff;font-size:11px;font-weight:800;padding:5px 12px;border-radius:999px;letter-spacing:.04em;}
.store-card h3{font-size:19px;margin-bottom:10px;}
.store-addr{font-size:13.5px;color:var(--muted);display:flex;gap:8px;margin-bottom:8px;}
.store-phone{font-size:14.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:7px;margin-bottom:16px;}
.store-actions{display:flex;gap:10px;}
.store-actions .btn{flex:1;padding:10px 12px;font-size:13px;}
 
/* Category grid */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.cat-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;text-align:left;transition:border-color .15s,transform .15s,box-shadow .15s;padding:0;display:flex;flex-direction:column;}
.cat-card:hover{border-color:var(--amber);transform:translateY(-4px);box-shadow:var(--shadow);}
.cat-card-body{padding:16px 18px 20px;}
.cat-card h4{font-size:16px;}
.cat-count{font-size:12.5px;color:var(--muted);margin-top:3px;}
.combo-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:100%;aspect-ratio:4/3;gap:2px;background:var(--line);}
 
/* ---------- Photo slot (real image w/ icon fallback) ---------- */
.photo-slot{position:relative;width:100%;height:100%;display:block;}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef1f8,#e3e8f2);color:var(--navy-3);}
.photo-fallback svg{width:36%;height:36%;}
.cat-photo .photo-fallback{background:var(--navy);color:#fff;}
.cat-photo .photo-fallback svg{width:30%;height:30%;}
.combo-quad .photo-fallback{background:var(--navy);color:#fff;}
.combo-quad .photo-fallback svg{width:34%;height:34%;}
.pdp-thumb-photo{width:64px;height:64px;border-radius:10px;overflow:hidden;border:2px solid var(--line);flex-shrink:0;}
.pdp-photo .photo-fallback svg,.pdp-photo .photo-fallback{width:100%;height:100%;}
.cart-photo{width:70px;height:70px;border-radius:10px;overflow:hidden;flex-shrink:0;}
.sugg-photo{width:38px;height:38px;border-radius:8px;overflow:hidden;flex-shrink:0;}
.sugg-photo .photo-fallback{background:var(--navy);color:#fff;}
.sugg-photo .photo-fallback svg{width:50%;height:50%;}
 
/* Product grid */
.prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.prod-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s, transform .15s;position:relative;}
.prod-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
.prod-thumb{aspect-ratio:1;background:linear-gradient(135deg,#eef1f8,#e3e8f2);display:flex;align-items:center;justify-content:center;color:var(--navy-3);position:relative;cursor:pointer;overflow:hidden;}
.prod-thumb .photo-slot{position:absolute;inset:0;}
.prod-thumb .initials{font-family:'Sora',sans-serif;font-size:30px;font-weight:800;opacity:.35;}
.sale-badge{position:absolute;top:10px;left:10px;background:var(--emerald);color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:7px;}
.wish-btn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:var(--navy);}
.prod-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.prod-cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.prod-name{font-size:14.5px;font-weight:700;cursor:pointer;line-height:1.3;min-height:38px;}
.prod-name:hover{color:var(--amber-dark);}
.prod-sku{font-size:11px;color:var(--muted);}
.prod-price-row{display:flex;align-items:baseline;gap:8px;margin-top:2px;}
.prod-price{font-size:17px;font-weight:800;color:var(--navy);}
.prod-mrp{font-size:12.5px;color:var(--muted);text-decoration:line-through;}
.prod-disc{font-size:11.5px;color:var(--emerald-dark);font-weight:700;}
.prod-stock{font-size:11.5px;color:var(--emerald-dark);font-weight:600;}
.prod-actions{display:flex;gap:8px;margin-top:10px;}
.prod-actions .btn{flex:1;padding:9px 10px;font-size:12.5px;}
 
/* Offers */
.offer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.offer-card{background:linear-gradient(160deg,var(--navy),var(--navy-3));border-radius:var(--radius-lg);padding:20px;color:#fff;}
.offer-photo{width:100%;height:120px;border-radius:12px;overflow:hidden;margin-bottom:14px;}
.offer-photo .photo-fallback{background:rgba(255,255,255,.08);color:#fff;}
.offer-photo .photo-fallback svg{width:26%;height:26%;}
.offer-tag{background:var(--amber);color:#fff;font-size:11px;font-weight:800;padding:4px 11px;border-radius:999px;display:inline-block;margin-bottom:14px;}
.offer-card h3{color:#fff;font-size:20px;margin-bottom:6px;}
.offer-card .price{font-size:26px;font-weight:800;color:#ffcf9a;margin:10px 0 14px;}
.offer-list{font-size:12.5px;color:#c9d3e8;margin:0 0 16px;padding-left:0;list-style:none;}
.offer-list li{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;}
 
/* Promo banner */
.promo{background:var(--amber);border-radius:var(--radius-lg);padding:44px 48px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;color:#fff;}
.promo h3{color:#fff;font-size:25px;max-width:520px;}
.promo p{color:rgba(255,255,255,.9);font-size:14.5px;margin-top:6px;}
 
/* Footer */
footer{background:var(--navy);color:#c9d3e8;padding:56px 0 26px;margin-top:40px;}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;}
.foot-grid h4{color:#fff;font-size:14.5px;margin-bottom:16px;}
.foot-grid ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:13.5px;}
.foot-grid ul a:hover{color:#fff;}
.foot-logo{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;color:#fff;margin-bottom:10px;}
.foot-logo span{color:var(--amber);}
.foot-desc{font-size:13.5px;color:#aebada;max-width:320px;line-height:1.6;}
.foot-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:40px;padding-top:22px;display:flex;justify-content:space-between;font-size:12.5px;color:#8b98b8;flex-wrap:wrap;gap:10px;}
 
/* Breadcrumb / page header */
.pagehead{background:#fff;border-bottom:1px solid var(--line);padding:22px 0;}
.crumbs{font-size:13px;color:var(--muted);}
.crumbs a:hover{color:var(--amber-dark);}
.pagehead h1{font-size:24px;margin-top:6px;}
 
/* Category / listing layout */
.listing{display:grid;grid-template-columns:250px 1fr;gap:32px;align-items:start;padding:36px 0 70px;}
.filterbox{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:20px;position:sticky;top:96px;}
.filterbox h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px;}
.filter-chip{display:flex;justify-content:space-between;padding:8px 4px;font-size:13.5px;border-radius:8px;cursor:pointer;}
.filter-chip:hover{background:#faf6ee;}
.filter-chip.active{background:var(--navy);color:#fff;}
.filter-chip span.n{color:var(--muted);font-size:12px;}
.filter-chip.active span.n{color:#c9d3e8;}
.listing-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.listing-top .count{color:var(--muted);font-size:13.5px;}
select.sortsel{border:1.5px solid var(--line);border-radius:9px;padding:9px 14px;font-size:13.5px;background:#fff;color:var(--ink);}
 
/* Empty state */
.empty{text-align:center;padding:70px 20px;color:var(--muted);}
.empty h3{color:var(--navy);margin-bottom:8px;}
 
/* Product detail */
.pdp{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;padding:40px 0 70px;}
.pdp-gallery-main{aspect-ratio:1;border-radius:20px;background:linear-gradient(135deg,#eef1f8,#e3e8f2);display:flex;align-items:center;justify-content:center;color:var(--navy-3);position:relative;overflow:hidden;}
.pdp-gallery-main .photo-slot{position:absolute;inset:0;}
.pdp-gallery-main .initials{font-size:64px;font-weight:800;opacity:.3;font-family:'Sora',sans-serif;}
.pdp-thumbs{display:flex;gap:10px;margin-top:14px;}
.pdp-thumb{width:64px;height:64px;border-radius:10px;background:#eef1f8;border:2px solid var(--line);}
.pdp-cat{color:var(--amber-dark);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;}
.pdp h1{font-size:28px;margin:8px 0 10px;}
.pdp-sku{color:var(--muted);font-size:13px;margin-bottom:18px;}
.pdp-price-row{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;}
.pdp-price{font-size:32px;font-weight:800;color:var(--navy);}
.pdp-mrp{font-size:16px;color:var(--muted);text-decoration:line-through;}
.pdp-disc{background:#eafbf3;color:var(--emerald-dark);font-weight:700;font-size:13px;padding:4px 10px;border-radius:7px;}
.pdp-stock{color:var(--emerald-dark);font-weight:600;font-size:13.5px;margin-bottom:22px;}
.qtybox{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content;}
.qtybox button{width:38px;height:42px;font-size:18px;color:var(--navy);}
.qtybox button:hover{background:#f3f0e9;}
.qtybox span{width:40px;text-align:center;font-weight:700;}
.pdp-actrow{display:flex;gap:14px;align-items:center;margin:20px 0 28px;}
.pdp-tabs{display:flex;gap:26px;border-bottom:1.5px solid var(--line);margin-bottom:20px;}
.pdp-tab{padding:10px 2px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;}
.pdp-tab.active{color:var(--navy);border-color:var(--amber);}
.spec-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.spec-row span:first-child{color:var(--muted);}
 
/* Cart */
.cart-layout{display:grid;grid-template-columns:1fr 340px;gap:32px;padding:40px 0 70px;align-items:start;}
.cart-item{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center;}
.cart-thumb{width:70px;height:70px;border-radius:10px;background:linear-gradient(135deg,#eef1f8,#e3e8f2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--navy-3);font-weight:800;font-family:'Sora',sans-serif;}
.cart-info{flex:1;min-width:0;}
.cart-info .n{font-weight:700;font-size:14.5px;}
.cart-info .c{font-size:12px;color:var(--muted);margin-top:2px;}
.cart-remove{color:#c0392b;font-size:12.5px;font-weight:600;margin-top:8px;display:inline-block;}
.cart-price{font-weight:800;color:var(--navy);white-space:nowrap;}
.summary-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:24px;position:sticky;top:96px;}
.summary-row{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;color:var(--muted);}
.summary-row.total{border-top:1.5px solid var(--line);margin-top:8px;padding-top:14px;font-size:16.5px;font-weight:800;color:var(--navy);}
.couponrow{display:flex;gap:8px;margin:14px 0;}
.couponrow input{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;}
 
/* Checkout form */
.checkout-layout{display:grid;grid-template-columns:1fr 340px;gap:32px;padding:40px 0 70px;align-items:start;}
.formcard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:28px;}
.formcard h3{font-size:17px;margin-bottom:18px;}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.formgrid .full{grid-column:1/-1;}
.field label{font-size:12.5px;font-weight:700;color:var(--navy);display:block;margin-bottom:6px;}
.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;font-size:14px;color:var(--ink);background:#faf9f6;}
.field input:focus,.field select:focus{border-color:var(--amber);background:#fff;}
.field.err input{border-color:#c0392b;}
.field .errmsg{color:#c0392b;font-size:11.5px;margin-top:4px;display:none;}
.field.err .errmsg{display:block;}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:13px;color:var(--muted);}
.agree a{color:var(--amber-dark);font-weight:600;}
.paymethods{display:flex;gap:12px;margin-top:6px;}
.paymethod{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:14px;text-align:center;cursor:pointer;font-size:13.5px;font-weight:700;}
.paymethod.active{border-color:var(--amber);background:#fff7ee;color:var(--amber-dark);}
 
/* order success */
.ordersuccess{max-width:520px;margin:70px auto;text-align:center;padding:0 20px;}
.ordersuccess .tick{width:74px;height:74px;border-radius:50%;background:#eafbf3;color:var(--emerald-dark);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;}
.ordersuccess .oid{background:#f3f0e9;border-radius:12px;padding:16px;font-weight:800;font-size:18px;color:var(--navy);margin:20px 0;letter-spacing:.03em;}
 
/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:100;display:flex;align-items:center;gap:10px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
 
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(14,30,59,.55);display:none;align-items:center;justify-content:center;z-index:90;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:18px;padding:32px;max-width:400px;width:100%;position:relative;}
.modal-close{position:absolute;top:16px;right:16px;color:var(--muted);font-size:20px;}
.modal h3{margin-bottom:6px;}
.modal p{color:var(--muted);font-size:13.5px;margin-bottom:20px;}
.modal .field{margin-bottom:14px;}
.modal-tabs{display:flex;gap:6px;background:#f3f0e9;border-radius:10px;padding:4px;margin-bottom:20px;}
.modal-tabs button{flex:1;padding:9px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--muted);}
.modal-tabs button.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08);}
 
/* Mobile */
@media (max-width:980px){
  .hero .wrap{grid-template-columns:1fr;padding:40px 20px 56px;}
  .hero h1{font-size:34px;}
  .hero-slide{min-height:380px;padding:44px 20px;}
  .hero-slide-body h1{font-size:28px;}
  .trust-strip .wrap{gap:16px;font-size:12px;}
  .stores-grid{grid-template-columns:1fr;}
  .cat-grid{grid-template-columns:repeat(2,1fr);}
  .prod-grid{grid-template-columns:repeat(2,1fr);}
  .offer-grid{grid-template-columns:1fr;}
  .listing{grid-template-columns:1fr;}
  .filterbox{position:static;}
  .foot-grid{grid-template-columns:1fr 1fr;}
  .pdp{grid-template-columns:1fr;}
  .cart-layout,.checkout-layout{grid-template-columns:1fr;}
  .formgrid{grid-template-columns:1fr;}
  .desk-only{display:none;}
  .mobile-only{display:flex;}
  .headerbar{height:64px;gap:14px;}
  .logo .mark{font-size:18px;}
  .logo .tag{display:none;}
  .searchbox{order:3;flex-basis:100%;max-width:none;margin:0 0 12px;}
  .headerbar{flex-wrap:wrap;}
}

<script>
/* Vijay Electronics — Admin Panel (separate page) */
(function(){
  var SUPABASE_URL = window.__VE_SUPABASE_URL__;
  var SUPABASE_ANON_KEY = window.__VE_SUPABASE_ANON_KEY__;
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 
  var state = { user:null, isAdmin:false, tab:'products', products:[], groups:[], categories:[] };
 
  function money(n){ return '₹' + Number(n).toLocaleString('en-IN'); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function storageUrl(bucket, path){ return SUPABASE_URL + '/storage/v1/object/public/' + bucket + '/' + path; }
  function toast(title, sub){
    var el = document.getElementById('toast');
    el.innerHTML = '<span>✓</span><span>'+escapeHtml(title)+(sub?' — '+escapeHtml(sub):'')+'</span>';
    el.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2400);
  }
 
  /* ---------------- Auth ---------------- */
  function refreshSession(){
    return sb.auth.getSession().then(function(res){
      var session = res.data && res.data.session;
      state.user = session ? session.user : null;
      if(!state.user){ state.isAdmin = false; return; }
      return sb.from('admin_users').select('id').eq('id', state.user.id).maybeSingle().then(function(r){
        state.isAdmin = !!(r.data);
      });
    });
  }
  function login(email, password){
    return sb.auth.signInWithPassword({email:email, password:password}).then(function(res){
      if(res.error){ toast('Login failed', res.error.message); return; }
      return refreshSession().then(render);
    });
  }
  function logout(){
    sb.auth.signOut().then(function(){ state.user=null; state.isAdmin=false; render(); });
  }
 
  /* ---------------- Data loaders ---------------- */
  function loadBaseData(){
    return Promise.all([
      sb.from('groups').select('id,name,icon').order('sort_order'),
      sb.from('categories').select('id,name,group_id,icon').order('sort_order')
    ]).then(function(r){
      state.groups = r[0].data || [];
      state.categories = r[1].data || [];
    });
  }
  function loadProducts(search){
    var q = sb.from('products').select('id,sku,name,brand,price,mrp,stock,active,categories(name,group_id)').order('id').limit(80);
    if(search){ q = q.or('name.ilike.%'+search+'%,sku.ilike.%'+search+'%'); }
    return q.then(function(r){
      state.products = (r.data||[]).map(function(p){
        return {id:p.id, sku:p.sku, name:p.name, brand:p.brand, price:Number(p.price), mrp:Number(p.mrp), stock:p.stock, active:p.active,
                category: p.categories?p.categories.name:'', group: p.categories?p.categories.group_id:'misc'};
      });
    });
  }
 
  /* ---------------- Renderers ---------------- */
  function doRegister(email, password, fullName, mobile){
    return sb.auth.signUp({email:email, password:password}).then(function(res){
      if(res.error){ toast('Registration failed', res.error.message); return; }
      var user = res.data.user;
      if(!user){ toast('Check your email to confirm, then log in.',''); return; }
      return sb.from('profiles').insert({id:user.id, full_name:fullName, email:email, mobile:mobile}).then(function(pres){
        if(pres.error) console.error(pres.error);
        if(res.data.session){
          toast('Account created', 'Ask the shop owner to grant Admin access');
          return refreshSession().then(render);
        } else {
          toast('Check your email to confirm your account, then log in.','');
        }
      });
    });
  }
 
  function renderLogin(){
    document.getElementById('app').innerHTML =
      '<div class="wrap" style="max-width:420px;padding:80px 20px">' +
        '<div class="foot-logo" style="color:var(--navy);margin-bottom:6px">VIJAY <span>ELECTRONICS</span></div>' +
        '<h1 style="margin-bottom:4px" id="authTitle">Admin Login</h1>' +
        '<p style="color:var(--muted);font-size:13.5px;margin-bottom:22px" id="authSub">Staff and shop-owner access only.</p>' +
        '<div class="modal-tabs"><button class="active" data-authtab="login">Login</button><button data-authtab="register">Register</button></div>' +
        '<div class="formcard" id="authBody">' +
          '<div class="field"><label>Email</label><input type="email" id="lEmail"></div>' +
          '<div class="field"><label>Password</label><input type="password" id="lPassword"></div>' +
          '<button class="btn btn-amber btn-block" id="lSubmit">Login</button>' +
        '</div>' +
        '<p style="color:var(--muted);font-size:12.5px;margin-top:16px" id="authNote">Registering here creates the same account used on the <a href="index.html" style="color:var(--amber-dark);font-weight:700">main site</a>. New accounts still need the shop owner to grant Admin access.</p>' +
      '</div>';
    document.getElementById('lSubmit').addEventListener('click', function(){
      login(document.getElementById('lEmail').value.trim(), document.getElementById('lPassword').value);
    });
    document.querySelectorAll('[data-authtab]').forEach(function(t){
      t.addEventListener('click', function(){
        document.querySelectorAll('[data-authtab]').forEach(function(x){x.classList.remove('active');});
        t.classList.add('active');
        var authBody = document.getElementById('authBody');
        if(t.getAttribute('data-authtab')==='register'){
          document.getElementById('authTitle').textContent = 'Create Account';
          document.getElementById('authSub').textContent = 'Register once, then ask the shop owner to grant Admin access.';
          authBody.innerHTML =
            '<div class="field"><label>Full Name</label><input type="text" id="rName"></div>' +
            '<div class="field"><label>Mobile Number</label><input type="tel" id="rMobile"></div>' +
            '<div class="field"><label>Email</label><input type="email" id="rEmail"></div>' +
            '<div class="field"><label>Password</label><input type="password" id="rPassword"></div>' +
            '<button class="btn btn-amber btn-block" id="rSubmit">Create Account</button>';
          document.getElementById('rSubmit').addEventListener('click', function(){
            doRegister(document.getElementById('rEmail').value.trim(), document.getElementById('rPassword').value, document.getElementById('rName').value.trim(), document.getElementById('rMobile').value.trim());
          });
        } else {
          document.getElementById('authTitle').textContent = 'Admin Login';
          document.getElementById('authSub').textContent = 'Staff and shop-owner access only.';
          authBody.innerHTML =
            '<div class="field"><label>Email</label><input type="email" id="lEmail"></div>' +
            '<div class="field"><label>Password</label><input type="password" id="lPassword"></div>' +
            '<button class="btn btn-amber btn-block" id="lSubmit">Login</button>';
          document.getElementById('lSubmit').addEventListener('click', function(){
            login(document.getElementById('lEmail').value.trim(), document.getElementById('lPassword').value);
          });
        }
      });
    });
  }
 
  function renderNotAdmin(){
    document.getElementById('app').innerHTML =
      '<div class="wrap" style="padding:80px 20px"><div class="empty">' +
        '<h3>This account isn\'t an Admin</h3>' +
        '<p>'+escapeHtml(state.user.email)+' is logged in but doesn\'t have admin access yet.</p>' +
        '<button class="btn btn-navy" id="backLogout">Logout</button>' +
      '</div></div>';
    document.getElementById('backLogout').addEventListener('click', logout);
  }
 
  function renderShell(bodyHtml){
    var tabs = ['products','categories','offers','orders','customers'];
    var tabBar = tabs.map(function(t){
      return '<div class="pdp-tab'+(state.tab===t?' active':'')+'" data-tab="'+t+'" style="text-transform:capitalize">'+t+'</div>';
    }).join('');
    document.getElementById('app').innerHTML =
      '<div class="pagehead"><div class="wrap" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
        '<div><div class="foot-logo" style="color:var(--navy);margin-bottom:2px">VIJAY <span>ELECTRONICS</span></div><p style="color:var(--muted);font-size:13px">Admin Dashboard &middot; '+escapeHtml(state.user.email)+'</p></div>' +
        '<div style="display:flex;gap:10px"><a class="btn btn-outline btn-sm" href="index.html">View Storefront</a><button class="btn btn-navy btn-sm" id="logoutBtn">Logout</button></div>' +
      '</div></div>' +
      '<div class="wrap pad"><div class="pdp-tabs">'+tabBar+'</div><div id="tabBody">'+bodyHtml+'</div></div>';
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.querySelectorAll('[data-tab]').forEach(function(el){
      el.addEventListener('click', function(){ state.tab = el.getAttribute('data-tab'); renderTab(); });
    });
  }
 
  function productRow(p){
    return '<div class="cart-item" style="flex-wrap:wrap">' +
      '<div class="photo-slot cart-photo"><img src="'+storageUrl('products', p.sku+'.jpg')+'" onerror="this.style.display=\'none\'"></div>' +
      '<div class="cart-info" style="min-width:180px">' +
        '<div class="n">'+escapeHtml(p.name)+'</div>' +
        '<div class="c">'+p.sku+' &middot; '+escapeHtml(p.category)+'</div>' +
        '<input type="file" accept="image/*" data-prod-upload="'+p.sku+'" style="margin-top:6px;font-size:11.5px">' +
      '</div>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<div class="field" style="margin:0"><label>Price</label><input type="number" style="width:90px" data-price="'+p.id+'" value="'+p.price+'"></div>' +
        '<div class="field" style="margin:0"><label>MRP</label><input type="number" style="width:90px" data-mrp="'+p.id+'" value="'+p.mrp+'"></div>' +
        '<div class="field" style="margin:0"><label>Stock</label><input type="number" style="width:70px" data-stock="'+p.id+'" value="'+p.stock+'"></div>' +
        '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)"><input type="checkbox" data-active="'+p.id+'" '+(p.active?'checked':'')+'>Active</label>' +
        '<button class="btn btn-navy btn-sm" data-save="'+p.id+'">Save</button>' +
      '</div>' +
    '</div>';
  }
 
  function renderProductsTab(){
    var catOptions = state.groups.map(function(g){
      var opts = state.categories.filter(function(c){return c.group_id===g.id;}).map(function(c){
        return '<option value="'+c.id+'">'+escapeHtml(c.name)+'</option>';
      }).join('');
      return '<optgroup label="'+escapeHtml(g.name)+'">'+opts+'</optgroup>';
    }).join('');
    return '<div class="formcard" style="border-style:dashed;margin-bottom:20px">' +
        '<h3>Add New Product</h3>' +
        '<div class="formgrid">' +
          '<div class="field"><label>Product Name</label><input type="text" id="newPName" placeholder="e.g. 32\\" Smart LED TV"></div>' +
          '<div class="field"><label>SKU</label><input type="text" id="newPSku" placeholder="e.g. VE-TELE-9001"></div>' +
          '<div class="field"><label>Brand</label><input type="text" id="newPBrand" placeholder="e.g. Takai"></div>' +
          '<div class="field"><label>Category</label><select id="newPCategory">'+catOptions+'</select></div>' +
          '<div class="field"><label>Price (₹)</label><input type="number" id="newPPrice"></div>' +
          '<div class="field"><label>MRP (₹)</label><input type="number" id="newPMrp"></div>' +
          '<div class="field"><label>Stock</label><input type="number" id="newPStock" value="50"></div>' +
        '</div>' +
        '<button class="btn btn-amber btn-sm" id="addProductBtn" style="margin-top:10px">Add Product</button>' +
      '</div>' +
      '<div class="formcard" style="margin-bottom:20px">' +
        '<h3>Stock List — Excel</h3>' +
        '<p style="color:var(--muted);font-size:13px;margin-bottom:12px">Download the full stock list, edit Price / MRP / Stock in Excel, then upload it back to update everything at once (matched by SKU).</p>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
          '<button class="btn btn-outline btn-sm" id="downloadStockBtn">⬇ Download Stock List (.xlsx)</button>' +
          '<label class="btn btn-outline btn-sm" style="cursor:pointer;margin:0">⬆ Update Stock from Excel<input type="file" id="stockUploadInput" accept=".xlsx,.xls,.csv" style="display:none"></label>' +
        '</div>' +
      '</div>' +
      '<div style="margin-bottom:14px"><input id="prodSearch" placeholder="Search by name or SKU…" style="width:100%;max-width:340px;border:1.5px solid var(--line);border-radius:9px;padding:10px 14px;font-size:13.5px"></div>' +
      '<div id="prodRows">'+state.products.map(productRow).join('')+'</div>' +
      '<p style="color:var(--muted);font-size:12.5px;margin-top:10px">Showing up to 80 results. Search to narrow further.</p>';
  }
 
  /* ---------------- Stock list: Excel export / bulk import ---------------- */
  function downloadStockList(){
    sb.from('products').select('sku,name,brand,price,mrp,stock,active,categories(name)').order('id').then(function(res){
      if(res.error){ toast('Download failed', res.error.message); return; }
      var rows = (res.data||[]).map(function(p){
        return {SKU:p.sku, Name:p.name, Brand:p.brand, Category:p.categories?p.categories.name:'', Price:p.price, MRP:p.mrp, Stock:p.stock, Active:p.active?'Yes':'No'};
      });
      var ws = XLSX.utils.json_to_sheet(rows);
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Stock');
      var today = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, 'vijay-electronics-stock-'+today+'.xlsx');
      toast('Stock list downloaded', rows.length+' products');
    });
  }
 
  function handleStockUpload(file){
    toast('Reading file…', '');
    var reader = new FileReader();
    reader.onload = function(e){
      var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      if(!rows.length){ toast('No rows found in that file',''); return; }
      var updated=0, notFound=0, failed=0;
      var jobs = rows.map(function(row){
        var sku = String(row.SKU || row.sku || '').trim();
        if(!sku) return Promise.resolve();
        var patch = {};
        if(row.Stock !== undefined && row.Stock !== '') patch.stock = parseInt(row.Stock, 10);
        if(row.Price !== undefined && row.Price !== '') patch.price = parseFloat(row.Price);
        if(row.MRP !== undefined && row.MRP !== '') patch.mrp = parseFloat(row.MRP);
        if(!Object.keys(patch).length) return Promise.resolve();
        return sb.from('products').update(patch).eq('sku', sku).select('id').then(function(r){
          if(r.error){ failed++; }
          else if(!r.data || !r.data.length){ notFound++; }
          else { updated++; }
        });
      });
      Promise.all(jobs).then(function(){
        toast('Stock list updated', updated+' updated, '+notFound+' SKU not found'+(failed?', '+failed+' failed':''));
        renderTab();
      });
    };
    reader.readAsArrayBuffer(file);
  }
 
  function renderCategoriesTab(){
    var groupOptions = state.groups.map(function(g){ return '<option value="'+g.id+'">'+escapeHtml(g.name)+'</option>'; }).join('');
    var addForm = '<div class="formcard" style="border-style:dashed;margin-bottom:20px">' +
        '<h3>Add New Category</h3>' +
        '<div class="formgrid">' +
          '<div class="field"><label>Category Name</label><input type="text" id="newCName" placeholder="e.g. Smart Watches"></div>' +
          '<div class="field"><label>Belongs to Group</label><select id="newCGroup">'+groupOptions+'</select></div>' +
          '<div class="field"><label>Icon key (optional)</label><input type="text" id="newCIcon" placeholder="box"></div>' +
        '</div>' +
        '<button class="btn btn-amber btn-sm" id="addCategoryBtn" style="margin-top:10px">Add Category</button>' +
      '</div>';
    return addForm + '<div class="cat-grid">' + state.groups.map(function(g){
      var count = state.categories.filter(function(c){return c.group_id===g.id;}).length;
      var quads = [1,2,3,4].map(function(i){
        return '<div class="photo-slot combo-quad"><img src="'+storageUrl('categories', g.id+'-'+i+'.jpg')+'" onerror="this.style.display=\'none\'"></div>';
      }).join('');
      var uploads = [1,2,3,4].map(function(i){
        return '<div style="flex:1;min-width:70px"><label style="font-size:11px;color:var(--muted)">Photo '+i+'</label><input type="file" accept="image/*" data-cat-upload="'+g.id+'" data-slot="'+i+'" style="width:100%;font-size:11px"></div>';
      }).join('');
      return '<div class="cat-card" style="text-align:left">' +
        '<div class="combo-grid">'+quads+'</div>' +
        '<div class="cat-card-body">' +
          '<h4>'+g.name+'</h4>' +
          '<div class="cat-count">'+count+' categories inside</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+uploads+'</div>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }
 
  function renderOffersTab(offers){
    var bannerSlots = [1,2,3,4].map(function(i){
      var label = i===1 ? '1 (Welcome)' : i===2 ? '2 (Trichy)' : i===3 ? '3 (Madurai)' : '4 (Othakadai)';
      return '<div style="flex:1;min-width:140px">' +
        '<div class="photo-slot" style="width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;margin-bottom:6px;background:linear-gradient(135deg,#eef1f8,#e3e8f2)"><img src="'+storageUrl('banners','hero-'+i+'.jpg')+'" onerror="this.style.display=\'none\'"></div>' +
        '<label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Slide '+label+'</label>' +
        '<input type="file" accept="image/*" data-banner-upload="'+i+'" style="font-size:11.5px;width:100%">' +
      '</div>';
    }).join('');
    var bannerBlock = '<div class="formcard" style="margin-bottom:20px">' +
        '<h3>Homepage Banner Photos</h3>' +
        '<p style="color:var(--muted);font-size:13px;margin-bottom:14px">These flow behind the homepage banner, one per store/welcome slide. Offer combo photos (below) automatically join the same flowing banner.</p>' +
        '<div style="display:flex;gap:14px;flex-wrap:wrap">'+bannerSlots+'</div>' +
      '</div>';
    var rows = offers.map(function(o){
      return '<div class="formcard" style="margin-bottom:16px" data-offer-card="'+o.id+'">' +
        '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px">' +
          '<div class="photo-slot" style="width:160px;height:100px;border-radius:10px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#eef1f8,#e3e8f2)"><img src="'+storageUrl('offers', o.id+'.jpg')+'" onerror="this.style.display=\'none\'"></div>' +
          '<div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:6px">Combo Image</label><input type="file" accept="image/*" data-offer-upload="'+o.id+'" style="font-size:12px"></div>' +
        '</div>' +
        '<div class="formgrid">' +
          '<div class="field"><label>Tag</label><input type="text" data-o-tag value="'+escapeHtml(o.tag||'')+'"></div>' +
          '<div class="field"><label>Title</label><input type="text" data-o-title value="'+escapeHtml(o.title||'')+'"></div>' +
          '<div class="field"><label>Price (₹)</label><input type="number" data-o-price value="'+o.price+'"></div>' +
          '<div class="field"><label>Active</label><select data-o-active><option value="true"'+(o.active?' selected':'')+'>Yes</option><option value="false"'+(!o.active?' selected':'')+'>No</option></select></div>' +
          '<div class="field full"><label>Items (one per line)</label><textarea data-o-items rows="4" style="width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px">'+escapeHtml((o.items||[]).join('\n'))+'</textarea></div>' +
        '</div>' +
        '<button class="btn btn-navy btn-sm" data-save-offer="'+o.id+'" style="margin-top:10px">Save Offer</button>' +
      '</div>';
    }).join('');
    return bannerBlock + rows +
      '<div class="formcard" style="border-style:dashed">' +
        '<h3>Add New Offer</h3>' +
        '<div class="formgrid">' +
          '<div class="field"><label>Tag</label><input type="text" id="newOTag" placeholder="TV COMBO"></div>' +
          '<div class="field"><label>Title</label><input type="text" id="newOTitle" placeholder="5 in 1 TV Combo"></div>' +
          '<div class="field"><label>Price (₹)</label><input type="number" id="newOPrice"></div>' +
          '<div class="field full"><label>Items (one per line)</label><textarea id="newOItems" rows="4" style="width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px"></textarea></div>' +
        '</div>' +
        '<button class="btn btn-amber btn-sm" id="addOfferBtn" style="margin-top:10px">Add Offer</button>' +
      '</div>';
  }
 
  function renderCustomersTab(customers, orderStats){
    if(!customers.length) return '<p style="color:var(--muted)">No registered customers yet.</p>';
    return '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13.5px">' +
      '<thead><tr style="text-align:left;border-bottom:2px solid var(--line)">' +
        '<th style="padding:10px 8px">Customer ID</th><th style="padding:10px 8px">Name</th><th style="padding:10px 8px">Email</th><th style="padding:10px 8px">Mobile</th><th style="padding:10px 8px">Joined</th><th style="padding:10px 8px">Orders</th><th style="padding:10px 8px">Total Spend</th><th style="padding:10px 8px"></th>' +
      '</tr></thead><tbody>' +
      customers.map(function(c){
        var stat = orderStats[c.id] || {count:0,total:0};
        return '<tr style="border-bottom:1px solid var(--line)" data-customer-row="'+c.id+'">' +
          '<td style="padding:10px 8px;font-weight:700">'+escapeHtml(c.customer_id||'')+'</td>' +
          '<td style="padding:10px 8px"><input type="text" data-c-name value="'+escapeHtml(c.full_name||'')+'" placeholder="(not set)" style="width:130px;border:1px solid var(--line);border-radius:6px;padding:5px 7px"></td>' +
          '<td style="padding:10px 8px">'+escapeHtml(c.email||'')+'</td>' +
          '<td style="padding:10px 8px"><input type="text" data-c-mobile value="'+escapeHtml(c.mobile||'')+'" placeholder="(not set)" style="width:110px;border:1px solid var(--line);border-radius:6px;padding:5px 7px"></td>' +
          '<td style="padding:10px 8px">'+new Date(c.created_at).toLocaleDateString('en-IN')+'</td>' +
          '<td style="padding:10px 8px">'+stat.count+'</td>' +
          '<td style="padding:10px 8px">'+money(stat.total)+'</td>' +
          '<td style="padding:10px 8px"><button class="btn btn-navy btn-sm" data-save-customer="'+c.id+'">Save</button></td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>';
  }
 
  function renderOrdersTab(orders){
    if(!orders.length) return '<p style="color:var(--muted)">No orders yet.</p>';
    var statuses = ['Order Placed','Confirmed','Processing','Packed','Shipped','Delivered','Cancelled'];
    return orders.map(function(o){
      var pay = (o.payments && o.payments[0]) || null;
      return '<div class="formcard" style="margin-bottom:16px">' +
        '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px">' +
          '<div>' +
            '<div style="font-weight:800;color:var(--navy)">'+o.order_number+'</div>' +
            '<div style="color:var(--muted);font-size:12.5px">'+new Date(o.created_at).toLocaleString('en-IN')+'</div>' +
          '</div>' +
          '<select data-order-status="'+o.id+'" style="border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:700;height:fit-content">' +
            statuses.map(function(s){return '<option value="'+s+'"'+(s===o.status?' selected':'')+'>'+s+'</option>';}).join('') +
          '</select>' +
        '</div>' +
        '<div class="formgrid" style="margin-bottom:14px">' +
          '<div><div style="font-size:11px;color:var(--muted);text-transform:uppercase">Customer</div><div style="font-weight:600">'+escapeHtml(o.customer_name)+'</div></div>' +
          '<div><div style="font-size:11px;color:var(--muted);text-transform:uppercase">Mobile</div><div style="font-weight:600"><a href="tel:'+o.mobile+'">'+o.mobile+'</a></div></div>' +
          '<div><div style="font-size:11px;color:var(--muted);text-transform:uppercase">Email</div><div style="font-weight:600">'+escapeHtml(o.email||'—')+'</div></div>' +
          '<div><div style="font-size:11px;color:var(--muted);text-transform:uppercase">Payment</div><div style="font-weight:600">'+escapeHtml(o.payment_method)+(o.payment_reference?' ('+escapeHtml(o.payment_reference)+')':'')+(pay?' · '+pay.status:'')+'</div></div>' +
          '<div class="full"><div style="font-size:11px;color:var(--muted);text-transform:uppercase">Delivery Address</div><div style="font-weight:600">'+escapeHtml(o.address)+', '+escapeHtml(o.district)+', '+escapeHtml(o.state)+' – '+escapeHtml(o.pincode)+', '+escapeHtml(o.country)+'</div></div>' +
        '</div>' +
        '<div style="border-top:1px solid var(--line);padding-top:10px">' +
          (o.order_items||[]).map(function(it){
            return '<div class="summary-row"><span>'+escapeHtml(it.product_name)+' ('+it.sku+') × '+it.quantity+'</span><span>'+money(it.line_total)+'</span></div>';
          }).join('') +
          '<div class="summary-row total"><span>Total</span><span>'+money(o.total)+'</span></div>' +
        '</div>' +
      '</div>';
    }).join('');
  }
 
  /* ---------------- Tab switching ---------------- */
  function renderTab(){
    var tabBody = document.getElementById('tabBody');
    if(state.tab==='products'){
      loadProducts().then(function(){
        tabBody.innerHTML = renderProductsTab();
        wireProductEvents();
      });
    } else if(state.tab==='categories'){
      tabBody.innerHTML = renderCategoriesTab();
      wireCategoryEvents();
    } else if(state.tab==='offers'){
      tabBody.innerHTML = '<p style="color:var(--muted)">Loading offers…</p>';
      sb.from('offers').select('*').order('id').then(function(r){
        tabBody.innerHTML = renderOffersTab(r.data||[]);
        wireOfferEvents();
      });
    } else if(state.tab==='orders'){
      tabBody.innerHTML = '<p style="color:var(--muted)">Loading orders…</p>';
      sb.from('orders').select('*, order_items(*), payments(*)').order('created_at', {ascending:false}).limit(80).then(function(r){
        tabBody.innerHTML = renderOrdersTab(r.data||[]);
        wireOrderEvents();
      });
    } else if(state.tab==='customers'){
      tabBody.innerHTML = '<p style="color:var(--muted)">Loading customers…</p>';
      Promise.all([
        sb.from('profiles').select('*').order('created_at', {ascending:false}),
        sb.from('orders').select('profile_id,total')
      ]).then(function(r){
        var customers = r[0].data || [];
        var orders = r[1].data || [];
        var stats = {};
        orders.forEach(function(o){
          if(!stats[o.profile_id]) stats[o.profile_id] = {count:0,total:0};
          stats[o.profile_id].count++;
          stats[o.profile_id].total += Number(o.total);
        });
        tabBody.innerHTML = renderCustomersTab(customers, stats);
        wireCustomerEvents();
      });
    }
  }
 
  function wireOrderEvents(){
    document.querySelectorAll('[data-order-status]').forEach(function(sel){
      sel.addEventListener('change', function(){
        sb.from('orders').update({status:sel.value}).eq('id', sel.getAttribute('data-order-status')).then(function(res){
          toast(res.error ? 'Update failed' : 'Order status updated', res.error ? res.error.message : '');
        });
      });
    });
  }
 
  function wireCustomerEvents(){
    document.querySelectorAll('[data-save-customer]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-save-customer');
        var row = document.querySelector('[data-customer-row="'+id+'"]');
        var payload = {
          full_name: row.querySelector('[data-c-name]').value.trim(),
          mobile: row.querySelector('[data-c-mobile]').value.trim()
        };
        sb.from('profiles').update(payload).eq('id', id).then(function(res){
          toast(res.error ? 'Save failed' : 'Customer updated', res.error ? res.error.message : '');
        });
      });
    });
  }
 
  function wireProductEvents(){
    var downloadBtn = document.getElementById('downloadStockBtn');
    if(downloadBtn){ downloadBtn.addEventListener('click', downloadStockList); }
    var stockUploadInput = document.getElementById('stockUploadInput');
    if(stockUploadInput){
      stockUploadInput.addEventListener('change', function(){
        if(stockUploadInput.files[0]) handleStockUpload(stockUploadInput.files[0]);
      });
    }
    var addBtn = document.getElementById('addProductBtn');
    if(addBtn){
      addBtn.addEventListener('click', function(){
        var payload = {
          sku: document.getElementById('newPSku').value.trim(),
          name: document.getElementById('newPName').value.trim(),
          brand: document.getElementById('newPBrand').value.trim() || 'Vijay Electronics',
          category_id: parseInt(document.getElementById('newPCategory').value, 10),
          price: parseFloat(document.getElementById('newPPrice').value),
          mrp: parseFloat(document.getElementById('newPMrp').value),
          stock: parseInt(document.getElementById('newPStock').value, 10) || 0,
          active: true
        };
        if(!payload.sku || !payload.name || !payload.category_id || isNaN(payload.price) || isNaN(payload.mrp)){
          toast('Fill in name, SKU, category, price and MRP', ''); return;
        }
        sb.from('products').insert(payload).then(function(res){
          if(res.error){ toast('Add failed', res.error.message); return; }
          toast('Product added', payload.name);
          document.getElementById('newPName').value = '';
          document.getElementById('newPSku').value = '';
          document.getElementById('newPBrand').value = '';
          document.getElementById('newPPrice').value = '';
          document.getElementById('newPMrp').value = '';
          renderTab();
        });
      });
    }
    document.querySelectorAll('[data-save]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-save');
        var price = parseFloat(document.querySelector('[data-price="'+id+'"]').value);
        var mrp = parseFloat(document.querySelector('[data-mrp="'+id+'"]').value);
        var stock = parseInt(document.querySelector('[data-stock="'+id+'"]').value,10);
        var active = document.querySelector('[data-active="'+id+'"]').checked;
        sb.from('products').update({price:price,mrp:mrp,stock:stock,active:active}).eq('id',id).then(function(res){
          toast(res.error ? 'Save failed' : 'Product updated', res.error ? res.error.message : '');
        });
      });
    });
    document.querySelectorAll('[data-prod-upload]').forEach(function(input){
      input.addEventListener('change', function(){
        var sku = input.getAttribute('data-prod-upload');
        var file = input.files[0];
        if(!file) return;
        sb.storage.from('products').upload(sku+'.jpg', file, {upsert:true}).then(function(res){
          if(res.error){ toast('Upload failed', res.error.message); return; }
          toast('Photo uploaded', sku);
          var row = input.closest('.cart-item');
          var img = row ? row.querySelector('.photo-slot img') : null;
          if(img){ img.style.display='block'; img.src = storageUrl('products', sku+'.jpg') + '?t=' + Date.now(); }
        });
      });
    });
    var search = document.getElementById('prodSearch');
    if(search){
      search.addEventListener('input', function(){
        loadProducts(search.value.trim()).then(function(){
          document.getElementById('prodRows').innerHTML = state.products.map(productRow).join('');
          wireProductEvents();
        });
      });
    }
  }
 
  function wireCategoryEvents(){
    var addBtn = document.getElementById('addCategoryBtn');
    if(addBtn){
      addBtn.addEventListener('click', function(){
        var payload = {
          name: document.getElementById('newCName').value.trim(),
          group_id: document.getElementById('newCGroup').value,
          icon: document.getElementById('newCIcon').value.trim() || 'box'
        };
        if(!payload.name){ toast('Enter a category name', ''); return; }
        sb.from('categories').insert(payload).then(function(res){
          if(res.error){ toast('Add failed', res.error.message); return; }
          toast('Category added', payload.name);
          loadBaseData().then(renderTab);
        });
      });
    }
    document.querySelectorAll('[data-cat-upload]').forEach(function(input){
      input.addEventListener('change', function(){
        var gid = input.getAttribute('data-cat-upload');
        var slot = input.getAttribute('data-slot') || '1';
        var file = input.files[0];
        if(!file) return;
        sb.storage.from('categories').upload(gid+'-'+slot+'.jpg', file, {upsert:true}).then(function(res){
          if(res.error){ toast('Upload failed', res.error.message); return; }
          toast('Photo '+slot+' uploaded', gid);
          var card = input.closest('.cat-card');
          var quads = card ? card.querySelectorAll('.combo-quad img') : [];
          var img = quads[parseInt(slot,10)-1];
          if(img){ img.style.display='block'; img.src = storageUrl('categories', gid+'-'+slot+'.jpg') + '?t=' + Date.now(); }
        });
      });
    });
  }
 
  function wireOfferEvents(){
    document.querySelectorAll('[data-banner-upload]').forEach(function(input){
      input.addEventListener('change', function(){
        var slot = input.getAttribute('data-banner-upload');
        var file = input.files[0];
        if(!file) return;
        sb.storage.from('banners').upload('hero-'+slot+'.jpg', file, {upsert:true}).then(function(res){
          if(res.error){ toast('Upload failed', res.error.message); return; }
          toast('Banner photo uploaded', 'Slide '+slot);
          var wrap = input.closest('div');
          var img = wrap ? wrap.querySelector('img') : null;
          if(img){ img.style.display='block'; img.src = storageUrl('banners','hero-'+slot+'.jpg') + '?t=' + Date.now(); }
        });
      });
    });
    document.querySelectorAll('[data-offer-upload]').forEach(function(input){
      input.addEventListener('change', function(){
        var oid = input.getAttribute('data-offer-upload');
        var file = input.files[0];
        if(!file) return;
        sb.storage.from('offers').upload(oid+'.jpg', file, {upsert:true}).then(function(res){
          if(res.error){ toast('Upload failed', res.error.message); return; }
          toast('Combo image uploaded', '');
          var card = input.closest('[data-offer-card]');
          var img = card ? card.querySelector('.photo-slot img') : null;
          if(img){ img.style.display='block'; img.src = storageUrl('offers', oid+'.jpg') + '?t=' + Date.now(); }
        });
      });
    });
    document.querySelectorAll('[data-save-offer]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-save-offer');
        var card = document.querySelector('[data-offer-card="'+id+'"]');
        var payload = {
          tag: card.querySelector('[data-o-tag]').value.trim(),
          title: card.querySelector('[data-o-title]').value.trim(),
          price: parseFloat(card.querySelector('[data-o-price]').value),
          active: card.querySelector('[data-o-active]').value === 'true',
          items: card.querySelector('[data-o-items]').value.split('\n').map(function(s){return s.trim();}).filter(Boolean)
        };
        sb.from('offers').update(payload).eq('id', id).then(function(res){
          toast(res.error ? 'Save failed' : 'Offer updated', res.error ? res.error.message : '');
        });
      });
    });
    var addBtn = document.getElementById('addOfferBtn');
    if(addBtn){
      addBtn.addEventListener('click', function(){
        var payload = {
          tag: document.getElementById('newOTag').value.trim(),
          title: document.getElementById('newOTitle').value.trim(),
          price: parseFloat(document.getElementById('newOPrice').value),
          items: document.getElementById('newOItems').value.split('\n').map(function(s){return s.trim();}).filter(Boolean),
          active: true
        };
        if(!payload.title){ toast('Enter a title first',''); return; }
        sb.from('offers').insert(payload).then(function(res){
          if(res.error){ toast('Add failed', res.error.message); return; }
          toast('Offer added','');
          renderTab();
        });
      });
    }
  }
 
  /* ---------------- Boot ---------------- */
  function render(){
    if(!state.user){ renderLogin(); return; }
    if(!state.isAdmin){ renderNotAdmin(); return; }
    renderShell('<p style="color:var(--muted)">Loading…</p>');
    renderTab();
  }
 
  document.addEventListener('DOMContentLoaded', function(){
    Promise.all([refreshSession(), loadBaseData()]).then(render);
    sb.auth.onAuthStateChange(function(){ refreshSession().then(render); });
  });
})();
 
</script>
</body>
</html>
