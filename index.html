<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vijay Electronics — Sound, Screens & Home Essentials | Trichy</title>
<meta name="description" content="Vijay Electronics — TVs, amplifiers, speakers, stabilizers, fans and home appliances at genuine wholesale prices. 3 stores in and around Trichy & Madurai.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Vijay Electronics — storefront styles */
:root{
  --navy:#0e1e3b;
  --navy-2:#152a52;
  --navy-3:#1e3a6e;
  --amber:#e8871e;
  --amber-dark:#c96f12;
  --emerald:#1c7a5e;
  --emerald-dark:#145c46;
  --cream:#f7f4ee;
  --card:#ffffff;
  --ink:#151a2b;
  --muted:#5c6478;
  --line:#e7e2d8;
  --radius-lg:20px;
  --radius-sm:8px;
  --shadow:0 10px 30px -12px rgba(14,30,59,.25);
  --maxw:1240px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
  background:var(--cream);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Sora','Inter',sans-serif;
  margin:0;
  color:var(--navy);
  font-weight:700;
  letter-spacing:-.01em;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
img{max-width:100%;display:block;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}

/* ---------- Topbar ---------- */
.topbar{background:var(--navy);color:#c9d3e8;font-size:13px;}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;height:36px;gap:16px;flex-wrap:wrap;}
.topbar a{color:#c9d3e8;}
.topbar .badge{color:#ffcf9a;display:flex;align-items:center;gap:6px;}
.topbar .left{display:flex;gap:22px;}
.topbar .left span{display:flex;align-items:center;gap:6px;}

/* ---------- Header ---------- */
header.site{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
.headerbar{display:flex;align-items:center;gap:28px;height:78px;}
.logo{display:flex;flex-direction:column;flex-shrink:0;}
.logo .mark{font-family:'Sora',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.01em;color:var(--navy);}
.logo .mark span{color:var(--amber);}
.logo .tag{font-size:10.5px;letter-spacing:.14em;color:var(--muted);margin-top:1px;}
.searchbox{flex:1;position:relative;max-width:560px;}
.searchbox input{
  width:100%;height:46px;border:1.5px solid var(--line);border-radius:999px;
  padding:0 20px 0 46px;font-size:14.5px;background:#faf9f6;color:var(--ink);
}
.searchbox input:focus{border-color:var(--amber);background:#fff;}
.searchbox .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);}
.search-suggest{
  position:absolute;top:52px;left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);max-height:420px;overflow:auto;z-index:50;display:none;
}
.search-suggest.open{display:block;}
.search-suggest .meta{padding:10px 18px 4px;font-size:11.5px;color:var(--muted);}
.sugg-item{display:flex;align-items:center;gap:12px;padding:10px 18px;cursor:pointer;}
.sugg-item:hover{background:#faf6ee;}
.sugg-thumb{width:38px;height:38px;border-radius:8px;background:var(--navy);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;}
.sugg-name{font-size:13.5px;font-weight:600;color:var(--ink);}
.sugg-sub{font-size:11.5px;color:var(--muted);}
.sugg-price{margin-left:auto;font-weight:700;font-size:13px;color:var(--navy);white-space:nowrap;}
.sugg-empty{padding:20px;text-align:center;color:var(--muted);font-size:13.5px;}
.navlinks{display:flex;align-items:center;gap:26px;flex-shrink:0;font-size:14.5px;font-weight:600;color:var(--navy);}
.navlinks a:hover{color:var(--amber-dark);}
.navlinks .fire{color:var(--amber-dark);}
.headicons{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.iconbtn{position:relative;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f3f0e9;color:var(--navy);}
.iconbtn:hover{background:#ece7db;}
.cartcount{position:absolute;top:-4px;right:-4px;background:var(--amber);color:#fff;font-size:10.5px;font-weight:800;border-radius:50%;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.mobile-only{display:none;}
.desk-only{display:flex;}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(150deg,var(--navy) 0%,var(--navy-3) 100%);color:#fff;position:relative;overflow:hidden;}
.hero .wrap{display:grid;grid-template-columns:1.25fr .85fr;gap:56px;padding:64px 24px 88px;align-items:center;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(232,135,30,.18);border:1px solid rgba(232,135,30,.4);color:#ffcf9a;font-size:13px;font-weight:700;padding:7px 16px;border-radius:999px;margin-bottom:22px;}
.hero h1{font-size:48px;line-height:1.08;color:#fff;max-width:560px;}
.hero h1 em{font-style:normal;color:var(--amber);}
.hero p.lead{color:#c9d3e8;font-size:16.5px;max-width:480px;margin-top:18px;}
.hero .ctas{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:12px;font-weight:700;font-size:15px;transition:transform .15s ease;}
.btn:active{transform:scale(.97);}
.btn-amber{background:var(--amber);color:#fff;}
.btn-amber:hover{background:var(--amber-dark);}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.35);}
.btn-ghost:hover{background:rgba(255,255,255,.16);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:var(--navy-2);}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--navy);}
.btn-outline:hover{border-color:var(--amber);}
.btn-block{width:100%;justify-content:center;}
.btn-sm{padding:9px 16px;font-size:13.5px;border-radius:9px;}
.trustcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:var(--radius-lg);padding:26px;backdrop-filter:blur(6px);}
.trust-row{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.12);}
.trust-row:last-child{border-bottom:none;}
.trust-ic{width:38px;height:38px;border-radius:10px;background:rgba(232,135,30,.22);color:var(--amber);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.trust-t{font-weight:700;font-size:14.5px;color:#fff;}
.trust-d{font-size:12.5px;color:#aebada;margin-top:2px;}

/* ---------- Sections ---------- */
section.pad{padding:64px 0;}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:30px;gap:20px;flex-wrap:wrap;}
.sec-head h2{font-size:28px;}
.sec-head p{color:var(--muted);font-size:14.5px;margin-top:4px;}
.sec-link{font-weight:700;color:var(--amber-dark);font-size:14px;white-space:nowrap;}

/* Stores */
.stores-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.store-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-lg);padding:26px;position:relative;}
.store-card.ho{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,135,30,.12);}
.store-badge{position:absolute;top:-12px;left:24px;background:var(--amber);color:#fff;font-size:11px;font-weight:800;padding:5px 12px;border-radius:999px;letter-spacing:.04em;}
.store-card h3{font-size:19px;margin-bottom:10px;}
.store-addr{font-size:13.5px;color:var(--muted);display:flex;gap:8px;margin-bottom:8px;}
.store-phone{font-size:14.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:7px;margin-bottom:16px;}
.store-actions{display:flex;gap:10px;}
.store-actions .btn{flex:1;padding:10px 12px;font-size:13px;}

/* Category grid */
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;}
.cat-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-lg);padding:22px 18px;text-align:left;transition:border-color .15s,transform .15s;}
.cat-card:hover{border-color:var(--amber);transform:translateY(-3px);}
.cat-ic{width:48px;height:48px;border-radius:13px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.cat-card h4{font-size:15px;}
.cat-count{font-size:12.5px;color:var(--muted);margin-top:3px;}

/* ---------- Photo slot (real image w/ icon fallback) ---------- */
.photo-slot{position:relative;width:100%;height:100%;display:block;}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef1f8,#e3e8f2);color:var(--navy-3);}
.photo-fallback svg{width:36%;height:36%;}
.cat-photo{width:64px;height:64px;border-radius:14px;overflow:hidden;margin-bottom:14px;}
.cat-photo .photo-fallback{background:var(--navy);color:#fff;}
.cat-photo .photo-fallback svg{width:44%;height:44%;}
.pdp-thumb-photo{width:64px;height:64px;border-radius:10px;overflow:hidden;border:2px solid var(--line);flex-shrink:0;}
.pdp-photo .photo-fallback svg,.pdp-photo .photo-fallback{width:100%;height:100%;}
.cart-photo{width:70px;height:70px;border-radius:10px;overflow:hidden;flex-shrink:0;}
.sugg-photo{width:38px;height:38px;border-radius:8px;overflow:hidden;flex-shrink:0;}
.sugg-photo .photo-fallback{background:var(--navy);color:#fff;}
.sugg-photo .photo-fallback svg{width:50%;height:50%;}

/* Product grid */
.prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.prod-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s, transform .15s;position:relative;}
.prod-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
.prod-thumb{aspect-ratio:1;background:linear-gradient(135deg,#eef1f8,#e3e8f2);display:flex;align-items:center;justify-content:center;color:var(--navy-3);position:relative;cursor:pointer;overflow:hidden;}
.prod-thumb .photo-slot{position:absolute;inset:0;}
.prod-thumb .initials{font-family:'Sora',sans-serif;font-size:30px;font-weight:800;opacity:.35;}
.sale-badge{position:absolute;top:10px;left:10px;background:var(--emerald);color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:7px;}
.wish-btn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:var(--navy);}
.prod-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.prod-cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.prod-name{font-size:14.5px;font-weight:700;cursor:pointer;line-height:1.3;min-height:38px;}
.prod-name:hover{color:var(--amber-dark);}
.prod-sku{font-size:11px;color:var(--muted);}
.prod-price-row{display:flex;align-items:baseline;gap:8px;margin-top:2px;}
.prod-price{font-size:17px;font-weight:800;color:var(--navy);}
.prod-mrp{font-size:12.5px;color:var(--muted);text-decoration:line-through;}
.prod-disc{font-size:11.5px;color:var(--emerald-dark);font-weight:700;}
.prod-stock{font-size:11.5px;color:var(--emerald-dark);font-weight:600;}
.prod-actions{display:flex;gap:8px;margin-top:10px;}
.prod-actions .btn{flex:1;padding:9px 10px;font-size:12.5px;}

/* Offers */
.offer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.offer-card{background:linear-gradient(160deg,var(--navy),var(--navy-3));border-radius:var(--radius-lg);padding:26px;color:#fff;}
.offer-tag{background:var(--amber);color:#fff;font-size:11px;font-weight:800;padding:4px 11px;border-radius:999px;display:inline-block;margin-bottom:14px;}
.offer-card h3{color:#fff;font-size:20px;margin-bottom:6px;}
.offer-card .price{font-size:26px;font-weight:800;color:#ffcf9a;margin:10px 0 14px;}
.offer-list{font-size:12.5px;color:#c9d3e8;margin:0 0 16px;padding-left:0;list-style:none;}
.offer-list li{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;}

/* Promo banner */
.promo{background:var(--amber);border-radius:var(--radius-lg);padding:44px 48px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;color:#fff;}
.promo h3{color:#fff;font-size:25px;max-width:520px;}
.promo p{color:rgba(255,255,255,.9);font-size:14.5px;margin-top:6px;}

/* Footer */
footer{background:var(--navy);color:#c9d3e8;padding:56px 0 26px;margin-top:40px;}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;}
.foot-grid h4{color:#fff;font-size:14.5px;margin-bottom:16px;}
.foot-grid ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:13.5px;}
.foot-grid ul a:hover{color:#fff;}
.foot-logo{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;color:#fff;margin-bottom:10px;}
.foot-logo span{color:var(--amber);}
.foot-desc{font-size:13.5px;color:#aebada;max-width:320px;line-height:1.6;}
.foot-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:40px;padding-top:22px;display:flex;justify-content:space-between;font-size:12.5px;color:#8b98b8;flex-wrap:wrap;gap:10px;}

/* Breadcrumb / page header */
.pagehead{background:#fff;border-bottom:1px solid var(--line);padding:22px 0;}
.crumbs{font-size:13px;color:var(--muted);}
.crumbs a:hover{color:var(--amber-dark);}
.pagehead h1{font-size:24px;margin-top:6px;}

/* Category / listing layout */
.listing{display:grid;grid-template-columns:250px 1fr;gap:32px;align-items:start;padding:36px 0 70px;}
.filterbox{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:20px;position:sticky;top:96px;}
.filterbox h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px;}
.filter-chip{display:flex;justify-content:space-between;padding:8px 4px;font-size:13.5px;border-radius:8px;cursor:pointer;}
.filter-chip:hover{background:#faf6ee;}
.filter-chip.active{background:var(--navy);color:#fff;}
.filter-chip span.n{color:var(--muted);font-size:12px;}
.filter-chip.active span.n{color:#c9d3e8;}
.listing-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.listing-top .count{color:var(--muted);font-size:13.5px;}
select.sortsel{border:1.5px solid var(--line);border-radius:9px;padding:9px 14px;font-size:13.5px;background:#fff;color:var(--ink);}

/* Empty state */
.empty{text-align:center;padding:70px 20px;color:var(--muted);}
.empty h3{color:var(--navy);margin-bottom:8px;}

/* Product detail */
.pdp{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;padding:40px 0 70px;}
.pdp-gallery-main{aspect-ratio:1;border-radius:20px;background:linear-gradient(135deg,#eef1f8,#e3e8f2);display:flex;align-items:center;justify-content:center;color:var(--navy-3);position:relative;overflow:hidden;}
.pdp-gallery-main .photo-slot{position:absolute;inset:0;}
.pdp-gallery-main .initials{font-size:64px;font-weight:800;opacity:.3;font-family:'Sora',sans-serif;}
.pdp-thumbs{display:flex;gap:10px;margin-top:14px;}
.pdp-thumb{width:64px;height:64px;border-radius:10px;background:#eef1f8;border:2px solid var(--line);}
.pdp-cat{color:var(--amber-dark);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;}
.pdp h1{font-size:28px;margin:8px 0 10px;}
.pdp-sku{color:var(--muted);font-size:13px;margin-bottom:18px;}
.pdp-price-row{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;}
.pdp-price{font-size:32px;font-weight:800;color:var(--navy);}
.pdp-mrp{font-size:16px;color:var(--muted);text-decoration:line-through;}
.pdp-disc{background:#eafbf3;color:var(--emerald-dark);font-weight:700;font-size:13px;padding:4px 10px;border-radius:7px;}
.pdp-stock{color:var(--emerald-dark);font-weight:600;font-size:13.5px;margin-bottom:22px;}
.qtybox{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content;}
.qtybox button{width:38px;height:42px;font-size:18px;color:var(--navy);}
.qtybox button:hover{background:#f3f0e9;}
.qtybox span{width:40px;text-align:center;font-weight:700;}
.pdp-actrow{display:flex;gap:14px;align-items:center;margin:20px 0 28px;}
.pdp-tabs{display:flex;gap:26px;border-bottom:1.5px solid var(--line);margin-bottom:20px;}
.pdp-tab{padding:10px 2px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;}
.pdp-tab.active{color:var(--navy);border-color:var(--amber);}
.spec-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.spec-row span:first-child{color:var(--muted);}

/* Cart */
.cart-layout{display:grid;grid-template-columns:1fr 340px;gap:32px;padding:40px 0 70px;align-items:start;}
.cart-item{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center;}
.cart-thumb{width:70px;height:70px;border-radius:10px;background:linear-gradient(135deg,#eef1f8,#e3e8f2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--navy-3);font-weight:800;font-family:'Sora',sans-serif;}
.cart-info{flex:1;min-width:0;}
.cart-info .n{font-weight:700;font-size:14.5px;}
.cart-info .c{font-size:12px;color:var(--muted);margin-top:2px;}
.cart-remove{color:#c0392b;font-size:12.5px;font-weight:600;margin-top:8px;display:inline-block;}
.cart-price{font-weight:800;color:var(--navy);white-space:nowrap;}
.summary-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:24px;position:sticky;top:96px;}
.summary-row{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;color:var(--muted);}
.summary-row.total{border-top:1.5px solid var(--line);margin-top:8px;padding-top:14px;font-size:16.5px;font-weight:800;color:var(--navy);}
.couponrow{display:flex;gap:8px;margin:14px 0;}
.couponrow input{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;}

/* Checkout form */
.checkout-layout{display:grid;grid-template-columns:1fr 340px;gap:32px;padding:40px 0 70px;align-items:start;}
.formcard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:28px;}
.formcard h3{font-size:17px;margin-bottom:18px;}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.formgrid .full{grid-column:1/-1;}
.field label{font-size:12.5px;font-weight:700;color:var(--navy);display:block;margin-bottom:6px;}
.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;font-size:14px;color:var(--ink);background:#faf9f6;}
.field input:focus,.field select:focus{border-color:var(--amber);background:#fff;}
.field.err input{border-color:#c0392b;}
.field .errmsg{color:#c0392b;font-size:11.5px;margin-top:4px;display:none;}
.field.err .errmsg{display:block;}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:13px;color:var(--muted);}
.agree a{color:var(--amber-dark);font-weight:600;}
.paymethods{display:flex;gap:12px;margin-top:6px;}
.paymethod{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:14px;text-align:center;cursor:pointer;font-size:13.5px;font-weight:700;}
.paymethod.active{border-color:var(--amber);background:#fff7ee;color:var(--amber-dark);}

/* order success */
.ordersuccess{max-width:520px;margin:70px auto;text-align:center;padding:0 20px;}
.ordersuccess .tick{width:74px;height:74px;border-radius:50%;background:#eafbf3;color:var(--emerald-dark);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;}
.ordersuccess .oid{background:#f3f0e9;border-radius:12px;padding:16px;font-weight:800;font-size:18px;color:var(--navy);margin:20px 0;letter-spacing:.03em;}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:100;display:flex;align-items:center;gap:10px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(14,30,59,.55);display:none;align-items:center;justify-content:center;z-index:90;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:18px;padding:32px;max-width:400px;width:100%;position:relative;}
.modal-close{position:absolute;top:16px;right:16px;color:var(--muted);font-size:20px;}
.modal h3{margin-bottom:6px;}
.modal p{color:var(--muted);font-size:13.5px;margin-bottom:20px;}
.modal .field{margin-bottom:14px;}
.modal-tabs{display:flex;gap:6px;background:#f3f0e9;border-radius:10px;padding:4px;margin-bottom:20px;}
.modal-tabs button{flex:1;padding:9px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--muted);}
.modal-tabs button.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08);}

/* Mobile */
@media (max-width:980px){
  .hero .wrap{grid-template-columns:1fr;padding:40px 20px 56px;}
  .hero h1{font-size:34px;}
  .stores-grid{grid-template-columns:1fr;}
  .cat-grid{grid-template-columns:repeat(2,1fr);}
  .prod-grid{grid-template-columns:repeat(2,1fr);}
  .offer-grid{grid-template-columns:1fr;}
  .listing{grid-template-columns:1fr;}
  .filterbox{position:static;}
  .foot-grid{grid-template-columns:1fr 1fr;}
  .pdp{grid-template-columns:1fr;}
  .cart-layout,.checkout-layout{grid-template-columns:1fr;}
  .formgrid{grid-template-columns:1fr;}
  .desk-only{display:none;}
  .mobile-only{display:flex;}
  .headerbar{height:64px;gap:14px;}
  .logo .mark{font-size:18px;}
  .logo .tag{display:none;}
  .searchbox{order:3;flex-basis:100%;max-width:none;margin:0 0 12px;}
  .headerbar{flex-wrap:wrap;}
}

</style>

  var state = {

  function parseHash(){
    var h = location.hash.replace(/^#\/?/, '');
    var parts = h.split('/').filter(Boolean);
    if(parts.length===0) return {name:'home'};
    if(parts[0]==='group') return {name:'group', id:parts[1]};
    if(parts[0]==='product') return {name:'product', id:parts[1]};
    if(parts[0]==='cart') return {name:'cart'};
    if(parts[0]==='checkout') return {name:'checkout'};
    if(parts[0]==='offers') return {name:'offers'};
    if(parts[0]==='stores') return {name:'stores'};
    if(parts[0]==='success') return {name:'success'};
    return {name:'home'};
  }

  function nav(hash){ location.hash = hash; }

  function cartCount(){
    var n=0; for(var k in state.cart) n+=state.cart[k];
    return n;
  }
  function cartLines(){
    return Object.keys(state.cart).map(function(id){
      var p = PRODUCTS.find(function(x){return String(x.id)===String(id);});
      return p ? {p:p, qty:state.cart[id]} : null;
    }).filter(Boolean);
  }
  function cartTotals(){
    var lines = cartLines();
    var subtotal = lines.reduce(function(s,l){return s + l.p.price*l.qty;},0);
    var mrpTotal = lines.reduce(function(s,l){return s + l.p.mrp*l.qty;},0);
    var discount = mrpTotal - subtotal;
    var delivery = subtotal>0 && subtotal<1500 ? 99 : 0;
    var total = subtotal + delivery;
    return {subtotal:subtotal, discount:discount, delivery:delivery, total:total, lines:lines};
  }
  function addToCart(id, qty){
    qty = qty || 1;
    state.cart[id] = (state.cart[id]||0) + qty;
    updateCartBadge();
    var p = PRODUCTS.find(function(x){return String(x.id)===String(id);});
    toast('Added to cart', p ? p.name : '');
  }
  function setQty(id, qty){
    if(qty<=0){ delete state.cart[id]; } else { state.cart[id]=qty; }
    updateCartBadge();
    render();
  }
  function updateCartBadge(){
    document.querySelectorAll('.cartcount').forEach(function(el){ el.textContent = cartCount(); });

    var el = document.getElementById('toast');

    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------------- Event wiring (delegated) ---------------- */

  function wireEvents(){
    document.querySelectorAll('[data-nav]').forEach(function(el){
      el.addEventListener('click', function(){ nav(el.getAttribute('data-nav')); });
    });
    document.querySelectorAll('[data-add]').forEach(function(el){
      el.addEventListener('click', function(e){ e.stopPropagation(); addToCart(el.getAttribute('data-add'),1); });
    });
    document.querySelectorAll('[data-buy]').forEach(function(el){
      el.addEventListener('click', function(e){ e.stopPropagation(); addToCart(el.getAttribute('data-buy'),1); nav('#/checkout'); });
    });
    document.querySelectorAll('[data-cat]').forEach(function(el){
      el.addEventListener('click', function(){
        var r = parseHash();
        location.hash = '#/group/'+r.id+(el.getAttribute('data-cat') ? '' : '');
        state.route.cat = el.getAttribute('data-cat') || null;
        render();
      });
    });
    var sortSel = document.getElementById('sortSel');
    if(sortSel){ sortSel.addEventListener('change', function(){ state.route.sort = sortSel.value; render(); }); }

    var pdpQty = document.getElementById('pdpQty');
    if(pdpQty){
      pdpQty.querySelectorAll('button').forEach(function(btn){
        btn.addEventListener('click', function(){
          var q = parseInt(pdpQty.getAttribute('data-qty'),10) + parseInt(btn.getAttribute('data-step'),10);
          if(q<1) q=1;
          pdpQty.setAttribute('data-qty', q);
          pdpQty.querySelector('span').textContent = q;
        });
      });
    }
    var pdpAdd = document.getElementById('pdpAdd');
    var pdpBuy = document.getElementById('pdpBuy');
    if(pdpAdd){
      pdpAdd.addEventListener('click', function(){
        var q = parseInt(document.getElementById('pdpQty').getAttribute('data-qty'),10);
        addToCart(state.route.id, q);
      });
    }
    if(pdpBuy){
      pdpBuy.addEventListener('click', function(){
        var q = parseInt(document.getElementById('pdpQty').getAttribute('data-qty'),10);
        addToCart(state.route.id, q);
        nav('#/checkout');
      });
    }
    document.querySelectorAll('.pdp-tab').forEach(function(t){
      t.addEventListener('click', function(){
        document.querySelectorAll('.pdp-tab').forEach(function(x){x.classList.remove('active');});
        t.classList.add('active');
        var body = document.getElementById('pdpTabBody');
        var p = PRODUCTS.find(function(x){return String(x.id)===String(state.route.id);});
        if(t.getAttribute('data-tab')==='specs'){
          body.innerHTML = '<div class="spec-row"><span>Brand</span><span>'+escapeHtml(p.brand)+'</span></div>' +
            '<div class="spec-row"><span>Category</span><span>'+escapeHtml(p.category)+'</span></div>' +
            '<div class="spec-row"><span>SKU</span><span>'+p.sku+'</span></div>' +
            '<div class="spec-row"><span>Warranty</span><span>As per brand policy</span></div>';
        } else {
          body.innerHTML = '<p style="color:var(--muted);font-size:14.5px;line-height:1.7">'+escapeHtml(p.brand)+' '+escapeHtml(p.name)+' — a genuine, billed '+escapeHtml(p.category.toLowerCase())+' backed by brand warranty and in-store service support at any of our 3 Vijay Electronics branches.</p>';
        }
      });
    });

    document.querySelectorAll('[data-cartqty]').forEach(function(box){
      var id = box.getAttribute('data-cartqty');
      box.querySelectorAll('button').forEach(function(btn){
        btn.addEventListener('click', function(){
          var cur = state.cart[id]||0;
          setQty(id, cur + parseInt(btn.getAttribute('data-step'),10));
        });
      });
    });
    document.querySelectorAll('[data-remove]').forEach(function(el){
      el.addEventListener('click', function(){ setQty(el.getAttribute('data-remove'), 0); });
    });

    var applyCoupon = document.getElementById('applyCoupon');
    if(applyCoupon){
      applyCoupon.addEventListener('click', function(){
        var v = document.getElementById('couponInput').value.trim();
        toast(v ? 'Coupon not valid' : 'Enter a coupon code first', '');
      });
    }

    document.querySelectorAll('.paymethod').forEach(function(el){
      el.addEventListener('click', function(){
        document.querySelectorAll('.paymethod').forEach(function(x){x.classList.remove('active');});
        el.classList.add('active');
      });
    });

    var placeOrderBtn = document.getElementById('placeOrderBtn');
    if(placeOrderBtn){
      placeOrderBtn.addEventListener('click', function(){
        var ids = ['fullName','mobile','email','address','pincode','district','state','country'];
        var ok = true;
        ids.forEach(function(id){
          var el = document.getElementById(id);
          var wrap = document.querySelector('[data-field="'+id+'"]');
          if(!el.value.trim()){ wrap.classList.add('err'); ok=false; } else { wrap.classList.remove('err'); }
        });
        var agree = document.getElementById('agreeTerms');
        if(!agree.checked){ ok=false; toast('Please accept the Terms & Return Policy',''); }
        if(!ok) return;
        var pay = document.querySelector('.paymethod.active').getAttribute('data-pay')==='cod' ? 'Cash on Delivery' : 'Manual / UPI Transfer';
        var t = cartTotals();
        var orderNum = 'VE-ORD-2026-' + String(Math.floor(100000+Math.random()*900000));
        state.lastOrder = {id: orderNum, name: document.getElementById('fullName').value.trim(), total: t.total, pay: pay};
        state.cart = {};
        updateCartBadge();
        nav('#/success');
      });
    }

    // login modal
    var loginBtn = document.getElementById('loginBtn');
    if(loginBtn){ loginBtn.addEventListener('click', openLoginModal); }
  }

  /* ---------------- Search ---------------- */
  function wireSearch(){
    document.body.addEventListener('input', function(e){
      if(e.target.id!=='searchInput') return;
      var q = e.target.value.trim().toLowerCase();
      var box = document.getElementById('searchSuggest');
      if(q.length<2){ box.classList.remove('open'); box.innerHTML=''; return; }
      var matches = PRODUCTS.filter(function(p){
        return p.name.toLowerCase().indexOf(q)>-1 ||
               p.category.toLowerCase().indexOf(q)>-1 ||
               p.sku.toLowerCase().indexOf(q)>-1 ||
               p.brand.toLowerCase().indexOf(q)>-1;
      }).slice(0,8);
      if(matches.length===0){
        box.innerHTML = '<div class="sugg-empty">No products found for "'+escapeHtml(e.target.value)+'"</div>';
      } else {
        box.innerHTML = '<div class="meta">'+matches.length+' result(s)</div>' + matches.map(function(p){
          return '<div class="sugg-item" data-nav="#/product/'+p.id+'">' +
            photoSlot('images/products/'+p.sku+'.jpg', iconFor(p.category), 'sugg-photo') +
            '<div><div class="sugg-name">'+escapeHtml(p.name)+'</div><div class="sugg-sub">'+p.sku+' &middot; '+escapeHtml(p.category)+'</div></div>' +
            '<div class="sugg-price">'+money(p.price)+'</div>' +
          '</div>';
        }).join('');
      }
      box.classList.add('open');
      box.querySelectorAll('[data-nav]').forEach(function(el){
        el.addEventListener('click', function(){
          nav(el.getAttribute('data-nav'));
          box.classList.remove('open');
          e.target.value='';
        });
      });
    });
    document.body.addEventListener('click', function(e){
      if(e.target.id==='searchInput') return;
      var box = document.getElementById('searchSuggest');
      if(box && !box.contains(e.target)) box.classList.remove('open');
    });
  }

  function openLoginModal(){
    var bg = document.getElementById('modalBg');
    bg.classList.add('open');
    bg.innerHTML = '<div class="modal">' +
      '<span class="modal-close" id="modalClose">✕</span>' +
      '<div class="modal-tabs"><button class="active" data-mtab="login">Login</button><button data-mtab="register">Register</button></div>' +
      '<div id="modalBody">' +
        '<h3>Welcome back</h3><p>Login to view your orders and saved address.</p>' +
        '<div class="field"><label>Mobile Number</label><input type="tel" placeholder="10-digit mobile number"></div>' +
        '<div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>' +
        '<button class="btn btn-amber btn-block" id="modalSubmit">Login</button>' +
      '</div>' +
    '</div>';
    document.getElementById('modalClose').addEventListener('click', closeModal);
    bg.addEventListener('click', function(e){ if(e.target===bg) closeModal(); });
    bg.querySelectorAll('[data-mtab]').forEach(function(t){
      t.addEventListener('click', function(){
        bg.querySelectorAll('[data-mtab]').forEach(function(x){x.classList.remove('active');});
        t.classList.add('active');
        var body = document.getElementById('modalBody');
        if(t.getAttribute('data-mtab')==='register'){
          body.innerHTML = '<h3>Create your account</h3><p>Get a Vijay Electronics customer ID for faster checkout.</p>' +
            '<div class="field"><label>Full Name</label><input type="text"></div>' +
            '<div class="field"><label>Mobile Number</label><input type="tel"></div>' +
            '<div class="field"><label>Password</label><input type="password"></div>' +
            '<button class="btn btn-amber btn-block" id="modalSubmit2">Create Account</button>';
          document.getElementById('modalSubmit2').addEventListener('click', function(){ toast('Account created (demo)',''); closeModal(); });
        } else {
          body.innerHTML = '<h3>Welcome back</h3><p>Login to view your orders and saved address.</p>' +
            '<div class="field"><label>Mobile Number</label><input type="tel" placeholder="10-digit mobile number"></div>' +
            '<div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>' +
            '<button class="btn btn-amber btn-block" id="modalSubmit">Login</button>';
          document.getElementById('modalSubmit').addEventListener('click', function(){ toast('Login is a demo — connect Supabase Auth to activate',''); closeModal(); });
        }
      });
    });
    var submitBtn = document.getElementById('modalSubmit');
    if(submitBtn) submitBtn.addEventListener('click', function(){ toast('Login is a demo — connect Supabase Auth to activate',''); closeModal(); });
  }
  function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }

  window.addEventListener('hashchange', render);
  document.addEventListener('DOMContentLoaded', function(){
    render();
    wireSearch();
  });
})();

</script>
</body>
</html>
